<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Automation Suite - Dashboard</title>
    <style>
        /* Reset & Base Variables */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-hover: #22222e;
            --border-color: #2a2a38;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b0;
            --accent-primary: #6366f1;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --accent-warning: #f59e0b;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            --radius: 8px;
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        /* Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .dashboard-title h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard-title p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* Cards Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .skill-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), #8b5cf6);
            opacity: 0;
            transition: var(--transition);
        }

        .skill-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-primary);
        }

        .skill-card:hover::before {
            opacity: 1;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .skill-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .skill-info .skill-desc {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Toggle Switch */
        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
            background: var(--bg-hover);
            border-radius: 13px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .toggle-switch.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .toggle-switch.active::after {
            left: 24px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.running {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.stopped {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Skill Actions */
        .skill-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: #5558e6;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        /* Recent Logs Section */
        .logs-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logs-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .logs-container {
            background: var(--bg-primary);
            border-radius: 6px;
            padding: 16px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
            font-size: 12px;
            line-height: 1.5;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .log-entry {
            display: grid;
            grid-template-columns: 120px 80px 1fr;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(42, 42, 56, 0.5);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--text-secondary);
            font-size: 11px;
        }

        .log-level {
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
        }

        .log-level.info { color: #60a5fa; }
        .log-level.success { color: var(--accent-success); }
        .log-level.warning { color: var(--accent-warning); }
        .log-level.error { color: var(--accent-danger); }

        .log-message {
            color: var(--text-primary);
            word-break: break-word;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .skills-grid {
                grid-template-columns: 1fr;
            }
            .dashboard-header {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
            .log-entry {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Dashboard Header -->
        <header class="dashboard-header">
            <div class="dashboard-title">
                <h1>Freelancer Automation Suite</h1>
                <p>Manage your AI-powered automation skills</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary">
                    <span>⚡</span> Start All
                </button>
                <button class="btn btn-secondary">
                    <span>⏹</span> Stop All
                </button>
                <button class="btn btn-primary">
                    <span>⚙</span> Global Settings
                </button>
            </div>
        </header>

        <!-- Skills Grid -->
        <main>
            <div class="skills-grid" id="skills-grid">
                <!-- Skills will be populated by JavaScript -->
            </div>

            <!-- Recent Logs -->
            <section class="logs-section">
                <div class="logs-header">
                    <h2>Recent Activity</h2>
                    <button class="btn btn-secondary" onclick="clearLogs()">Clear</button>
                </div>
                <div class="logs-container" id="logs-container">
                    <!-- Logs will be populated by JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // Sample skill data (10 skills)
        const skills = [
            { id: 1, name: 'GitHub Issues', desc: 'Automatically fetch and fix GitHub issues with PRs', icon: '🐙', enabled: true, status: 'running' },
            { id: 2, name: 'Web Search', desc: 'AI-optimized search via Tavily API', icon: '🔍', enabled: true, status: 'running' },
            { id: 3, name: 'Google Workspace', desc: 'Gmail, Calendar, Drive, Sheets integration', icon: '📧', enabled: false, status: 'stopped' },
            { id: 4, name: 'Canvas Design', desc: 'Create visual art and designs', icon: '🎨', enabled: true, status: 'running' },
            { id: 5, name: 'Weather', desc: 'Current conditions and forecasts', icon: '🌤', enabled: true, status: 'running' },
            { id: 6, name: 'GitHub', desc: 'Issues, PRs, CI runs and code review', icon: '🔧', enabled: false, status: 'stopped' },
            { id: 7, name: 'Web Deploy', desc: 'Deploy static sites to GitHub Pages', icon: '🚀', enabled: true, status: 'running' },
            { id: 8, name: 'UI/UX Pro Max', desc: '50 styles, 21 palettes, shadcn/ui components', icon: '💎', enabled: true, status: 'running' },
            { id: 9, name: 'Branding', desc: 'Build distinctive brand identity', icon: '✨', enabled: false, status: 'stopped' },
            { id: 10, name: 'Frontend Ultimate', desc: 'Production-grade React + Tailwind sites', icon: '⚛', enabled: true, status: 'running' }
        ];

        // Sample log data
        const sampleLogs = [
            { time: '19:56:23', level: 'info', message: 'Dashboard initialized successfully' },
            { time: '19:56:22', level: 'success', message: 'GitHub Issues skill started (worker-1)' },
            { time: '19:56:21', level: 'info', message: 'Loading skill configuration from config/skills.json' },
            { time: '19:56:20', level: 'success', message: 'Web Search skill health check passed' },
            { time: '19:56:19', level: 'warning', message: 'Google Workspace: API quota at 85%' },
            { time: '19:56:18', level: 'info', message: 'Checking for skill updates...' },
            { time: '19:56:17', level: 'success', message: 'Canvas Design: rendered 3 assets' },
            { time: '19:56:16', level: 'info', message: 'Weather: fetched forecast for Los Angeles' },
            { time: '19:56:15', level: 'success', message: 'GitHub: authenticated as morpheus' },
            { time: '19:56:14', level: 'info', message: 'Web Deploy: site build completed in 12.4s' },
            { time: '19:56:13', level: 'success', message: 'UI/UX Pro Max: component library loaded' },
            { time: '19:56:12', level: 'info', message: 'Branding: brand assets validated' },
            { time: '19:56:11', level: 'info', message: 'Frontend Ultimate: bundling with Vite' },
            { time: '19:56:10', level: 'success', message: 'All skills health check passed (10/10)' },
            { time: '19:56:09', level: 'info', message: 'Gateway connection established' },
            { time: '19:56:08', level: 'info', message: 'Memory module loaded (mem0)' },
            { time: '19:56:07', level: 'success', message: 'Configuration loaded from .openclaw/' },
            { time: '19:56:06', level: 'info', message: 'System startup sequence initiated' },
            { time: '19:56:05', level: 'info', message: 'OpenClaw v1.2.3 ready' },
            { time: '19:56:04', level: 'info', message: 'Node.js v24.13.1 • Model: step-3.5-flash' }
        ];

        // Render skills
        function renderSkills() {
            const grid = document.getElementById('skills-grid');
            grid.innerHTML = skills.map(skill => `
                <div class="skill-card" data-skill-id="${skill.id}">
                    <div class="skill-header">
                        <div class="skill-info">
                            <h3>${skill.icon} ${skill.name}</h3>
                            <p class="skill-desc">${skill.desc}</p>
                        </div>
                        <div class="toggle-wrapper">
                            <div class="toggle-switch ${skill.enabled ? 'active' : ''}" 
                                 onclick="toggleSkill(${skill.id})"></div>
                        </div>
                    </div>
                    <div style="margin-top: 12px;">
                        <span class="status-badge ${skill.status}">${skill.status}</span>
                    </div>
                    <div class="skill-actions">
                        <button class="btn btn-primary" onclick="configureSkill(${skill.id})">
                            ⚙ Configure
                        </button>
                        <button class="btn btn-secondary" onclick="viewLogs(${skill.id})">
                            📋 Logs
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Render logs
        function renderLogs() {
            const container = document.getElementById('logs-container');
            container.innerHTML = sampleLogs.map(log => `
                <div class="log-entry">
                    <span class="log-time">${log.time}</span>
                    <span class="log-level ${log.level}">${log.level}</span>
                    <span class="log-message">${log.message}</span>
                </div>
            `).join('');
        }

        // Toggle skill
        function toggleSkill(id) {
            const skill = skills.find(s => s.id === id);
            skill.enabled = !skill.enabled;
            skill.status = skill.enabled ? 'running' : 'stopped';
            renderSkills();
            addLog('info', `Skill "${skill.name}" ${skill.enabled ? 'enabled' : 'disabled'} by user`);
        }

        // Config button
        function configureSkill(id) {
            const skill = skills.find(s => s.id === id);
            addLog('info', `Opening config for ${skill.name}...`);
            // In real app: open modal or navigate to /skills/[id]/config
        }

        // View logs
        function viewLogs(id) {
            const skill = skills.find(s => s.id === id);
            addLog('info', `Showing logs for ${skill.name}...`);
        }

        // Add new log entry
        function addLog(level, message) {
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            sampleLogs.unshift({ time, level, message });
            if (sampleLogs.length > 20) sampleLogs.pop();
            renderLogs();
        }

        // Clear logs
        function clearLogs() {
            sampleLogs.length = 0;
            renderLogs();
        }

        // Initialize
        renderSkills();
        renderLogs();

        // Simulate real-time logs
        setInterval(() => {
            const levels = ['info', 'success', 'warning', 'error'];
            const messages = [
                'Heartbeat received from worker',
                'Processing task queue...',
                'Health check: all systems go',
                'Memory cache hit ratio: 94%',
                'API rate limit: 120/1000 remaining'
            ];
            const randomLevel = levels[Math.floor(Math.random() * levels.length)];
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            addLog(randomLevel, randomMessage);
        }, 8000);
    </script>
</body>
</html>
